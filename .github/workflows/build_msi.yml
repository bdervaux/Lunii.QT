name: Build for Windows (MSI & Portable)

on:
  workflow_dispatch:
  push:
    branches:
      - cx_freeze
      - nouvelle-interface
    tags:
      - v*.*.*

jobs:
  build_win:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5.0.0
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install cx_freeze

    - name: Python generate resources
      run: |
        pyside6-uic ./pkg/ui/main.ui -o ./pkg/ui/main_ui.py
        pyside6-uic ./pkg/ui/nm.ui   -o ./pkg/ui/nm_ui.py
        pyside6-lupdate ./pkg/ui/main.ui ./pkg/ui/nm.ui ./pkg/ui/about_ui.py ./pkg/ui/debug_ui.py ./pkg/ui/login_ui.py ./pkg/nm_window.py ./pkg/main_window.py ./pkg/ierWorker.py ./pkg/versionWorker.py ./pkg/api/devices.py ./pkg/api/device_flam.py ./pkg/api/device_lunii.py ./pkg/ui/modern_ui.py ./pkg/library_view.py -ts ./locales/fr_FR.ts
        pyside6-lrelease ./locales/fr_FR.ts ./locales/fr_FR.qm  
        pyside6-rcc ./resources.qrc -o ./resources_rc.py

    - name: cx_Freeze - Build EXE
      run: |
        python setup.py build_exe

    - name: Insert icon (manually)
      run: |
        tools\rcedit-x64.exe build\exe.win-amd64-3.11\MyLunii.exe --set-icon res\mylunii.ico

    - name: cx_Freeze - Build MSI
      run: |
        python setup.py bdist_msi

    - name: Create portable archive
      run: |
        Copy-Item -Path "./build/exe.win-amd64-3.11" -Destination ./build/MyLunii -Recurse
        Compress-Archive -DestinationPath MyLunii-${{ github.ref_name }}-win64_portable.zip -CompressionLevel Optimal -Path ./build/MyLunii

    - name: Upload MSI
      uses: actions/upload-artifact@v4.0.0
      with:
        name: MyLunii-${{ github.ref_name }}-win64_msi
        path: |
          ./dist/*.msi

    - name: Upload Portable
      uses: actions/upload-artifact@v4.0.0
      with:
        name: MyLunii-${{ github.ref_name }}-win64_portable
        path: |
          ./build/MyLunii

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: true
        files: |
          ./dist/*.msi
          MyLunii-${{ github.ref_name }}-win64_portable.zip